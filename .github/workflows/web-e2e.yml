name: Web E2E

# Web unit tests (vitest) + Playwright end-to-end tests. The e2e specs mock the
# local worker with network interception and auto-start the Next.js dev server,
# so no real worker process is required.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch:

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
        env:
          CI: "true"
