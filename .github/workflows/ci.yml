name: CI

# Local-worker test suite (pytest) and CLI unit tests (node:test). Each job
# runs only when files it covers (or this workflow) change.
on:
  push:
    branches: [main]
    paths:
      - "apps/local-worker/**"
      - "packages/cli/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/local-worker/**"
      - "packages/cli/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local-worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker (editable) + test deps
        run: pip install -e . pytest pytest-rerunfailures

      - name: Run tests
        # A couple of worktree/git tests are occasionally flaky under load;
        # rerun failures so genuine regressions still fail but races don't.
        run: pytest -p no:cacheprovider --reruns 2 --reruns-delay 1

  cli-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run CLI unit tests
        run: npm test
