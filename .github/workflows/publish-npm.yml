name: Publish npm

# Publishes the `repooperator` CLI to npm. The package's prepack script bundles
# the local-worker and web runtime into packages/cli/runtime/ before publish.
#
# Requires an NPM_TOKEN repository secret (an npm automation/publish token).
# Triggers:
#   - pushing a version tag like v0.3.0
#   - manual run from the Actions tab (workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish with --dry-run (no actual publish)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full monorepo for runtime bundling)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cli
        run: |
          PKG_VERSION="$(node -e "console.log(require('./package.json').version)")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "Publishing repooperator@$PKG_VERSION"

      - name: Publish to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
